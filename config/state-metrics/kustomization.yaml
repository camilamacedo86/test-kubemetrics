# ADD:TO MAKE WORK - the whole config/state-metrics directory is not scaffolded by Kubebuilder.
#
# Deploys kube-state-metrics to expose metrics about the custom resources of this project.
#
# The files in bases/ are generated by "make manifests" (controller-gen state-metrics-config) from the
# "+k8s:controller-gen:metrics" markers on the API types:
# - bases/metrics.yaml: the custom resource state configuration of kube-state-metrics
# - bases/rbac.yaml: the ClusterRole granting read access to the custom resources
resources:
- bases/rbac.yaml
- service_account.yaml
- crd_reader_role.yaml
- role_binding.yaml
- crd_reader_role_binding.yaml
- deployment.yaml
- service.yaml
# [PROMETHEUS] To let Prometheus scrape the custom resource metrics, uncomment the following line.
# It requires the Prometheus Operator CRDs to be installed in the cluster.
#- monitor.yaml

# The generated configuration is mounted into kube-state-metrics. A change of the configuration
# changes the name suffix of the ConfigMap, which rolls out kube-state-metrics.
configMapGenerator:
- name: state-metrics-config
  namespace: system
  files:
  - metrics.yaml=bases/metrics.yaml
  options:
    labels:
      app.kubernetes.io/name: test-kubemetrics
      app.kubernetes.io/managed-by: kustomize
