# ADD:TO MAKE WORK - not scaffolded by Kubebuilder, see kustomization.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: test-kubemetrics
    app.kubernetes.io/component: state-metrics
    app.kubernetes.io/managed-by: kustomize
  name: state-metrics
  namespace: system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: test-kubemetrics
      app.kubernetes.io/component: state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: test-kubemetrics
        app.kubernetes.io/component: state-metrics
    spec:
      serviceAccountName: state-metrics
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: kube-state-metrics
        # The generated configuration is based on the types of this kube-state-metrics version.
        image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
        args:
        # Only expose the metrics of the custom resources, not of the core resources.
        - --custom-resource-state-only=true
        - --custom-resource-state-config-file=/etc/state-metrics/metrics.yaml
        - --port=8080
        - --telemetry-port=8081
        ports:
        - containerPort: 8080
          name: http-metrics
          protocol: TCP
        - containerPort: 8081
          name: telemetry
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /livez
            port: http-metrics
          initialDelaySeconds: 5
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: telemetry
          initialDelaySeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - "ALL"
        volumeMounts:
        - name: config
          mountPath: /etc/state-metrics
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: state-metrics-config
