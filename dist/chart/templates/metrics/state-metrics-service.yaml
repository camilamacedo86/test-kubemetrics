apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: state-metrics
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "test-kubemetrics.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "test-kubemetrics.resourceName" (dict "suffix" "state-metrics-service" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  ports:
  - name: http-metrics
    port: 8080
    protocol: TCP
    targetPort: http-metrics
  selector:
    app.kubernetes.io/component: state-metrics
    app.kubernetes.io/name: {{ include "test-kubemetrics.name" . }}
