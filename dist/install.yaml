apiVersion: v1
data:
  metrics.yaml: |
    # Generated by controller-gen
    # Generated based on types for kube-state-metrics v2.20.0
    ---
    kind: CustomResourceStateMetrics
    spec:
      resources:
      - groupVersionKind:
          group: crew.example.com
          kind: Captain
          version: v1
        labelsFromPath:
          exported_namespace:
          - metadata
          - namespace
          name:
          - metadata
          - name
          rank:
          - spec
          - rank
        metricNamePrefix: captain
        metrics:
        - each:
            gauge:
              path:
              - metadata
              - creationTimestamp
            type: Gauge
          help: Unix creation timestamp.
          name: created
        - each:
            gauge:
              path:
              - spec
              - replicas
            type: Gauge
          help: The desired number of crew members.
          name: spec_replicas
        - each:
            stateSet:
              labelName: status
              labelsFromPath:
                type:
                - type
              list:
              - "True"
              - "False"
              - Unknown
              path:
              - status
              - conditions
              valueFrom:
              - status
            type: StateSet
          help: The condition of a captain.
          name: status_condition
        - each:
            gauge:
              labelsFromPath:
                status:
                - status
                type:
                - type
              path:
              - status
              - conditions
              valueFrom:
              - lastTransitionTime
            type: Gauge
          help: The condition last transition time of a captain.
          name: status_condition_last_transition_time
        - each:
            stateSet:
              labelName: phase
              list:
              - Pending
              - Ready
              - Failed
              path:
              - status
              - phase
            type: StateSet
          help: The phase of a captain.
          name: status_phase
        - each:
            gauge:
              nilIsZero: true
              path:
              - status
              - readyReplicas
            type: Gauge
          help: The number of ready crew members.
          name: status_ready_replicas
        - each:
            info:
              labelsFromPath:
                tag: []
              path:
              - spec
              - tags
            type: Info
          help: The tags of a captain.
          name: tags
