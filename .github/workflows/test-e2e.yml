name: E2E Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    # ADD:TO MAKE WORK - the scaffold runs "make test-e2e" once. The matrix runs the e2e tests, which verify
    # the state metrics generated by controller-gen, for each way of deploying the project:
    # - default: the default kustomize scaffold (config/default) plus config/state-metrics
    # - all-options: all the options of the kustomize scaffold enabled by hack/all-options.sh
    #   (Prometheus ServiceMonitors, NetworkPolicies, cert-manager certificates for the metrics)
    # - helm: the Helm chart (dist/chart), generated from the kustomize output with all options enabled
    name: Run on Ubuntu (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: default
            target: test-e2e
          - profile: all-options
            target: test-e2e-all-options
          - profile: helm
            target: test-e2e-helm
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        env:
          TARGET: ${{ matrix.target }}
        run: |
          go mod tidy
          # Use the kind installed above
          make "$TARGET" KIND=kind
